<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sticky Navigation</title>


<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    overflow-x: hidden;
}

img {
    display: block;
    width: 100%;
    height: auto;
}


/* =========================================================
   NAV
   ========================================================= */

/*
   nav-wrapper ALWAYS occupies the original space of nav.

   This is important because when the nav itself becomes
   fixed, the page must not collapse upwards.
*/

.nav-wrapper {
    width: 100%;
}


/*
   This is the ONE and ONLY nav.png.
*/

.nav {
    width: 100%;
    position: relative;
    z-index: 100;
}


/*
   When filters reaches the top, nav becomes fixed.

   It starts above the viewport.
*/

.nav.is-sticky {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    transform: translateY(-100%);

    z-index: 1000;
}


/*
   Nav slides into view.
*/

.nav.is-sticky.is-visible {
    transform: translateY(0);

    transition:
        transform 300ms ease;
}


/*
   Nav slides out of view.
*/

.nav.is-sticky.is-hiding {
    transform: translateY(-100%);

    transition:
        transform 300ms ease;
}


/* =========================================================
   FILTERS
   ========================================================= */

/*
   This is the ONE and ONLY filters.png.

   The wrapper itself is sticky.

   Its position in the document NEVER changes.
*/

.filters-wrapper {
    position: sticky;

    top: 0;

    width: 100%;

    z-index: 500;
}


/*
   The filters image itself.
*/

.filters {
    width: 100%;

    transform: translateY(0);
}


/*
   When nav appears, filters moves down by exactly
   the height of nav.
*/

.filters-wrapper.nav-visible .filters {
    transform: translateY(var(--nav-height));

    transition:
        transform 300ms ease;
}


/*
   When nav disappears, filters returns to the top.
*/

.filters-wrapper.nav-hiding .filters {
    transform: translateY(0);

    transition:
        transform 300ms ease;
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .nav.is-sticky,
    .filters {
        transition: none !important;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         STRIPE
         ===================================================== -->

    <img
        src="stripe.png"
        alt=""
    >


    <!-- =====================================================
         NAV
         ===================================================== -->

    <!--
         There is exactly ONE nav.png.

         The wrapper preserves its original document height.
    -->

    <div
        class="nav-wrapper"
        id="navWrapper"
    >

        <div
            class="nav"
            id="nav"
        >

            <img
                src="nav.png"
                alt=""
            >

        </div>

    </div>


    <!-- =====================================================
         TOP
         ===================================================== -->

    <img
        src="top.png"
        alt=""
    >


    <!-- =====================================================
         FILTERS
         ===================================================== -->

    <!--
         There is exactly ONE filters.png.

         This wrapper is the sticky element.
    -->

    <div
        class="filters-wrapper"
        id="filtersWrapper"
    >

        <div
            class="filters"
            id="filters"
        >

            <img
                src="filters.png"
                alt=""
            >

        </div>

    </div>


    <!-- =====================================================
         LIST
         ===================================================== -->

    <img
        src="list.png"
        alt=""
    >


</div>



<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const nav =
    document.getElementById('nav');

const navWrapper =
    document.getElementById('navWrapper');

const filtersWrapper =
    document.getElementById('filtersWrapper');

const filters =
    document.getElementById('filters');


/* =========================================================
   STATE
   ========================================================= */

let lastScrollY = window.scrollY;

let filtersIsSticky = false;

let navIsVisible = false;

let scrollDirection = null;

let upwardDistance = 0;


/* =========================================================
   NAV HEIGHT
   ========================================================= */

function updateNavHeight() {

    /*
       navWrapper retains the nav's original dimensions,
       even when nav becomes fixed.
    */

    const height =
        navWrapper.offsetHeight;

    document.documentElement.style.setProperty(
        '--nav-height',
        `${height}px`
    );
}


/* =========================================================
   ACTIVATE STICKY NAV
   ========================================================= */

function activateStickyNav() {

    if (filtersIsSticky) {
        return;
    }

    filtersIsSticky = true;


    /*
       Measure nav before taking it out of normal flow.
    */

    updateNavHeight();


    /*
       Move the SAME nav element to fixed positioning.

       It starts completely above the viewport.
    */

    nav.classList.add('is-sticky');


    /*
       Make sure nav is definitely hidden initially.
    */

    nav.classList.remove(
        'is-visible',
        'is-hiding'
    );

}


/* =========================================================
   SHOW NAV
   ========================================================= */

function showNav() {

    if (navIsVisible) {
        return;
    }

    navIsVisible = true;


    /*
       Remove the hiding state.
    */

    nav.classList.remove(
        'is-hiding'
    );


    /*
       Force the browser to recognise the starting
       position before beginning the animation.
    */

    void nav.offsetHeight;

    void filters.offsetHeight;


    /*
       Animate both elements simultaneously.
    */

    nav.classList.add(
        'is-visible'
    );

    filtersWrapper.classList.remove(
        'nav-hiding'
    );

    filtersWrapper.classList.add(
        'nav-visible'
    );

}


/* =========================================================
   HIDE NAV
   ========================================================= */

function hideNav() {

    if (!navIsVisible) {
        return;
    }

    navIsVisible = false;


    /*
       Remove nav-visible from filters first.

       This causes filters to move back to top.
    */

    filtersWrapper.classList.remove(
        'nav-visible'
    );

    filtersWrapper.classList.add(
        'nav-hiding'
    );


    /*
       At the same time nav slides upwards.
    */

    nav.classList.remove(
        'is-visible'
    );

    nav.classList.add(
        'is-hiding'
    );

}


/* =========================================================
   DEACTIVATE EVERYTHING
   ========================================================= */

function deactivateSticky() {

    filtersIsSticky = false;

    navIsVisible = false;

    upwardDistance = 0;

    scrollDirection = null;


    /*
       Remove all sticky/animation states.
    */

    nav.classList.remove(
        'is-sticky',
        'is-visible',
        'is-hiding'
    );

    filtersWrapper.classList.remove(
        'nav-visible',
        'nav-hiding'
    );


    /*
       Return everything to its original document
       position.
    */

    updateNavHeight();

}


/* =========================================================
   CHECK WHETHER FILTERS IS AT ITS NATURAL POSITION
   ========================================================= */

function checkFiltersPosition() {

    /*
       Before sticky activation, this tells us where
       filters currently is.

       Once filters is sticky, its rect.top will normally
       be 0.

       When scrolling back upward beyond its original
       position, rect.top becomes positive again.
    */

    const rect =
        filtersWrapper.getBoundingClientRect();


    /*
       If filters is no longer at the top, the user has
       scrolled back above its sticky position.
    */

    if (
        filtersIsSticky &&
        rect.top > 0
    ) {

        deactivateSticky();

        return true;
    }


    return false;
}


/* =========================================================
   SCROLL
   ========================================================= */

window.addEventListener(
    'scroll',
    function () {

        const currentScrollY =
            window.scrollY;

        const delta =
            currentScrollY - lastScrollY;


        /*
           Ignore tiny movements.
        */

        if (Math.abs(delta) < 1) {
            return;
        }


        /* =================================================
           CHECK STICKY POSITION
           ================================================= */

        if (!filtersIsSticky) {

            const rect =
                filtersWrapper.getBoundingClientRect();


            /*
               Filters has reached the top of the viewport.
            */

            if (rect.top <= 0) {

                activateStickyNav();

            }

        }
        else {

            /*
               Check whether we've scrolled back above
               the original filters position.
            */

            if (checkFiltersPosition()) {

                lastScrollY =
                    currentScrollY;

                return;
            }

        }


        /* =================================================
           SCROLLING DOWN
           ================================================= */

        if (delta > 0) {

            /*
               Direction has changed.
            */

            if (scrollDirection !== 'down') {

                scrollDirection = 'down';

                upwardDistance = 0;
            }


            /*
               When scrolling down, nav disappears.
            */

            if (filtersIsSticky) {

                hideNav();

            }

        }


        /* =================================================
           SCROLLING UP
           ================================================= */

        else {

            /*
               Direction has changed.
            */

            if (scrollDirection !== 'up') {

                scrollDirection = 'up';

                upwardDistance = 0;
            }


            /*
               Only count upward scrolling once filters
               has become sticky.
            */

            if (filtersIsSticky) {

                upwardDistance +=
                    Math.abs(delta);


                /*
                   NAV APPEARS AFTER 48PX
                */

                if (
                    upwardDistance >= 48 &&
                    !navIsVisible
                ) {

                    showNav();

                }

            }

        }


        lastScrollY =
            currentScrollY;

    },
    {
        passive: true
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    'resize',
    function () {

        updateNavHeight();

    }
);


/* =========================================================
   INITIALISE
   ========================================================= */

updateNavHeight();

</script>


</body>
</html>
