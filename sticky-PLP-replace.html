<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Navigation Replaces Filters</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0;}
body { overflow-x: hidden; }
img { display: block; width: 375px; height: auto; }
.nav-wrapper, .nav, .filters-wrapper, .filters { width: 100%; }
.nav-wrapper, .filters-wrapper { position: relative; }
.filters-wrapper.is-replaced { visibility: hidden; }

/* display:none is intentional: the fixed UI cannot appear on initial view. */
.fixed-stack {
    display: none;
    position: fixed;
    inset: 0 0 auto 0;
    width: 100%;
    z-index: 1000;
    background: #fff;
}
.fixed-stack.is-active { display: block; }
.fixed-stage {
    position: relative;
    width: 100%;
    height: var(--filters-height, 0px);
    overflow: hidden;
    background: #fff;
    transition: height 300ms ease;
}
.fixed-nav, .fixed-filters {
    position: absolute;
    inset: 0 0 auto 0;
    width: 100%;
    background: #fff;
}
.fixed-nav {
    z-index: 2;
    transform: translateY(-100%);
    transition: transform 300ms ease;
}
.fixed-filters { z-index: 1; }
.fixed-stack.nav-visible .fixed-stage { height: var(--nav-height, 0px); }
.fixed-stack.nav-visible .fixed-nav { transform: translateY(0); }
.fixed-stack.nav-visible .fixed-filters,
.fixed-stack.filters-released .fixed-filters { visibility: hidden; }

@media (prefers-reduced-motion: reduce) {
    .fixed-stage, .fixed-nav { transition: none !important; }
}
</style>
</head>
<body>
<div class="page">
    <img src="stripe.png" alt="">
    <div class="nav-wrapper" id="navWrapper">
        <div class="nav"><img src="nav.png" alt=""></div>
    </div>
    <img src="top.png" alt="">

    <!-- This zero-height marker identifies the exact sticky threshold. -->
    <div id="filtersSentinel" aria-hidden="true"></div>
    <div class="filters-wrapper" id="filtersWrapper">
        <div class="filters"><img src="filters.png" alt=""></div>
    </div>
    <img src="list.png" alt="">
</div>

<div class="fixed-stack" id="fixedStack" aria-hidden="true">
    <div class="fixed-stage">
        <div class="fixed-nav"><img src="nav.png" alt=""></div>
        <div class="fixed-filters"><img src="filters.png" alt=""></div>
    </div>
</div>

<script>
const navWrapper = document.getElementById('navWrapper');
const filtersSentinel = document.getElementById('filtersSentinel');
const filtersWrapper = document.getElementById('filtersWrapper');
const fixedStack = document.getElementById('fixedStack');

let lastScrollY = window.scrollY;
let fixedMode = false;
let navIsVisible = false;
let fixedFiltersActive = false;
let lastDirection = null;

function measure() {
    document.documentElement.style.setProperty('--nav-height', `${navWrapper.offsetHeight}px`);
    document.documentElement.style.setProperty('--filters-height', `${filtersWrapper.offsetHeight}px`);
}

function activateFixedMode() {
    if (fixedMode) return;
    fixedMode = true;
    navIsVisible = false;
    fixedFiltersActive = true;
    lastDirection = 'down';
    filtersWrapper.classList.add('is-replaced');
    fixedStack.classList.remove('nav-visible', 'filters-released');
    fixedStack.classList.add('is-active');
    fixedStack.setAttribute('aria-hidden', 'false');
}

function deactivateFixedMode() {
    if (!fixedMode) return;
    fixedMode = false;
    navIsVisible = false;
    fixedFiltersActive = false;
    lastDirection = null;
    fixedStack.classList.remove('is-active', 'nav-visible', 'filters-released');
    fixedStack.setAttribute('aria-hidden', 'true');
    filtersWrapper.classList.remove('is-replaced');
}

function showNavInsteadOfFilters() {
    if (!fixedMode || navIsVisible) return;
    navIsVisible = true;
    fixedStack.classList.add('nav-visible');
}
function showFiltersInsteadOfNav() {
    if (!fixedMode || !navIsVisible) return;
    navIsVisible = false;
    fixedStack.classList.remove('nav-visible');
}
function releaseFiltersToPage() {
    if (!fixedMode || !fixedFiltersActive) return;
    fixedFiltersActive = false;
    filtersWrapper.classList.remove('is-replaced');
    fixedStack.classList.add('filters-released');
}
function restoreFixedFilters() {
    if (!fixedMode || fixedFiltersActive) return;
    fixedFiltersActive = true;
    filtersWrapper.classList.add('is-replaced');
    fixedStack.classList.remove('filters-released');
}
function syncFiltersHandoff(direction) {
    if (!fixedMode || navIsVisible) return;
    const originalTop = filtersWrapper.getBoundingClientRect().top;
    if (direction === 'up' && fixedFiltersActive && originalTop >= 0) releaseFiltersToPage();
    if (direction === 'down' && !fixedFiltersActive && originalTop <= 0) restoreFixedFilters();
}

function handleScroll() {
    const currentScrollY = window.scrollY;
    const delta = currentScrollY - lastScrollY;
    if (Math.abs(delta) < 1) return;
    const direction = delta > 0 ? 'down' : 'up';

    /* Only pin while scrolling down, after the true threshold crosses the top. */
    if (!fixedMode && direction === 'down' && filtersSentinel.getBoundingClientRect().top <= 0) {
        activateFixedMode();
    }

    if (fixedMode) {
        if (navWrapper.getBoundingClientRect().top >= 0) {
            deactivateFixedMode();
            lastScrollY = currentScrollY;
            return;
        }
        if (direction !== lastDirection) {
            if (direction === 'up') showNavInsteadOfFilters();
            else showFiltersInsteadOfNav();
            lastDirection = direction;
        }
        syncFiltersHandoff(direction);
    }
    lastScrollY = currentScrollY;
}

/* Explicit initial reset, including when restored from browser history. */
function initialise() {
    fixedStack.classList.remove('is-active', 'nav-visible', 'filters-released');
    filtersWrapper.classList.remove('is-replaced');
    fixedStack.setAttribute('aria-hidden', 'true');
    fixedMode = false;
    navIsVisible = false;
    fixedFiltersActive = false;
    lastDirection = null;
    lastScrollY = window.scrollY;
    measure();

    /* If the browser restores a position below the filters, match that position. */
    if (filtersSentinel.getBoundingClientRect().top <= 0) activateFixedMode();
}

window.addEventListener('scroll', handleScroll, { passive: true });
window.addEventListener('resize', measure);
window.addEventListener('load', initialise);
window.addEventListener('pageshow', initialise);
measure();
</script>
</body>
</html>
